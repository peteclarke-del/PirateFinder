# Amiga boot block virus markers, read by piratefinder.images.virus.
#
# Each rule names a virus when every check holds: `checks` pairs an offset
# in the 1,024-byte boot block with the bytes (hexadecimal) found there. A
# rule with `code = true` also needs the boot block to show at least one of
# the Amiga code patterns in indicators.toml (a reset vector, a disk write,
# a device request and so on), since a single value is weak evidence on its
# own. Rules are tried in order after the signatures in amiga-signatures.toml
# and after the Amiga Bootblock Reader brainfile, when it is installed; the
# first that holds names the virus, which is then removable like any other
# identified boot virus when the disk has an intact AmigaDOS root block.
#
# Sources, used for their facts (offsets and values) only:
#   - VirusX 4.0 by Steve Tibbett and Dan James (Fish disk 287): the two
#     longwords its virus table checks on a boot block. VirusX is
#     "Copyrighted, but freely redistributable ... Do what you want with it".
#     All 25 rules are kept: none holds on any of the 318 labelled boot
#     blocks that are not viruses. Rules for Pentagon Circle, BackFlash,
#     Phantasmumble, Graffiti and VKill have no sample to confirm them.
#   - AntiCicloVir 2.4 by Matthias Gutt (1994), whose assembler source is
#     public domain ("you can do everything with the program and this
#     source"): one longword at an offset per boot block virus. On their own
#     five of its 184 values also hold on boot blocks that are not viruses
#     (WAFT, GX.Team, BLF, Virus Construction Set, Incognito). A value is
#     kept only when it holds on a labelled sample of the virus it names, it
#     holds with the code check on that sample, and it holds on no labelled
#     boot block that is not a virus; 58 of the 184 are kept. The rest were
#     dropped: most name viruses with no sample to test them against, and
#     the others hit samples of a different virus or fail the code check.
#
# `seen` lists the labelled virus samples the rule held on when it was
# tested; it is for information and is not read.

[[rule]]
name = "Microsystems"
checks = [{ offset = 0x040, bytes = "040000FE" }, { offset = 0x080, bytes = "00000200" }]
code = false
source = "VirusX 4.0, Microsystems"
seen = ["Digital Life 2 Virus", "Starlight II Virus"]

