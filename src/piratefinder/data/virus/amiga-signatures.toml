# Amiga boot block virus signatures, read by piratefinder.images.virus.
#
# A signature is the SHA-1 of a stretch of the virus code: `length` bytes
# starting at `offset` in the 1,024-byte boot block. It never covers the DOS
# type, checksum and root pointer in the first 12 bytes, and it leaves out
# the counters, saved vectors and keys a virus changes as it runs, so every
# copy of the virus matches. No virus code is stored here.
#
# PirateFinder derived each window from a sample of the virus (the sample's
# SHA-1 is given in `source`) by disassembling it and keeping only code that
# does not change. Every window matches its sample, and none matches any of
# the 318 labelled boot blocks that are not viruses (loaders, intros,
# anti-virus and utility blocks, the standard install blocks). The names
# agree with the virus tables of AntiCicloVir 2.4 (Matthias Gutt, public
# domain) and VirusX 4.0 (Steve Tibbett and Dan James) where those list the
# virus.
#
# Entries are tried in order and the first match names the virus, so a
# window for one exact version comes before a shorter window its variants
# share. A match makes the boot block removable when the disk has an intact
# AmigaDOS root block, as for a virus the Amiga Bootblock Reader brainfile
# names; the brainfile, when installed, is asked first.

