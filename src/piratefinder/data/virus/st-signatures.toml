length = 140
sha1 = "736ba024758efa0f64c6037e07ac76d1bbdcdd05"
source = "Reference sector in The Killer 2.0 and Xtermine 0.2"
note = "It hooks the hdv_bpb disk vector and writes itself to the boot sector of each disk the computer reads afterwards."

