# Atari ST boot sector virus signatures, read by piratefinder.images.virus.
#
# A signature is the SHA-1 of a stretch of the virus code: `length` bytes
# starting at `offset` in the 512-byte boot sector. It never covers the whole
# sector, because the branch, OEM text, serial number and disk parameters in
# the first 30 bytes and the checksum word at the end differ from disk to
# disk, and it leaves out the bytes a virus changes as it spreads.
#
# Only executable boot sectors (word sum 0x1234) are checked. A match makes
# the sector removable when its disk parameters describe the image: the code
# area is cleared and the sector made non-executable. A match on a sector
# that is not executable, or whose opening branch lands on a return, is an
# inactive copy and is reported as such.
#
# The windows were taken from the reference sectors in the freeware ST
# anti-virus programs The Killer 2.0 (KILLER.DAT) and Xtermine 0.2 / The
# Exorcist (EXORCIST.LIB), and from boot sectors kept with published ST
# sources. Each is a fact about the virus code; no virus code is stored here.
# Checked against 5,188 menu and compilation disk images: the Ghost window
# finds every Ghost infection among them and no other sector, and no window
# matches an immuniser or a TOS boot loader.

[[signature]]
name = "Ghost"
offset = 0x1E
length = 66
sha1 = "0fe84e3489f1a5152858d45b297a645952634151"
source = "Install code of the Ghost boot sector in GHOST.VIR (Gen&Wax Visual Assembler sources); the same in GhostKiller 1.0 (Rick ST, 1993), The Killer 2.0 and Xtermine 0.2"
note = "Ghost stays in memory across a reset and copies itself to every disk inserted; after a number of copies it reverses the vertical mouse movement."

