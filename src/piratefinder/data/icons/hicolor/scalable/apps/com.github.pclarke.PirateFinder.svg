<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>PirateFinder</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ed333b"/>
      <stop offset="1" stop-color="#c01c28"/>
    </linearGradient>
    <linearGradient id="shutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0bfbc"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7d6d3"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#1e1a26"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#c0dcf8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#99c1f1" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f06b"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#865e3c"/>
      <stop offset="1" stop-color="#63452c"/>
    </linearGradient>
  </defs>

  <!-- The disk: a darker base edge under the face, GNOME style, with the
       cut corner that makes a 3.5-inch floppy recognisable. -->
  <path d="M22 16h72l14 14v80a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z" fill="#a51d2d"/>
  <path d="M22 12h72l14 14v80a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6V18a6 6 0 0 1 6-6z" fill="url(#body)"/>
  <path d="M22 13h71.6l13.4 13.4" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Sliding metal shutter and its window onto the disk. -->
  <rect x="36" y="12" width="52" height="34" fill="url(#shutter)"/>
  <rect x="36" y="44.5" width="52" height="1.5" fill="#9a9996"/>
  <rect x="71" y="18" width="11" height="22" rx="1.5" fill="#3d3846"/>

  <!-- Write-protect hole. -->
  <rect x="21" y="100" width="6" height="6" rx="1" fill="#7a1320"/>

  <!-- The label is the flag. -->
  <rect x="26" y="54" width="72" height="50" rx="4" fill="url(#label)"/>
  <g stroke="#f6f5f4" stroke-width="5.5" stroke-linecap="round">
    <path d="M37 65L69 95M69 65L37 95"/>
  </g>
  <g fill="#f6f5f4">
    <circle cx="34" cy="64.5" r="3.3"/><circle cx="37.5" cy="61.5" r="3.3"/>
    <circle cx="72" cy="64.5" r="3.3"/><circle cx="68.5" cy="61.5" r="3.3"/>
    <circle cx="34" cy="95.5" r="3.3"/><circle cx="37.5" cy="98.5" r="3.3"/>
    <circle cx="72" cy="95.5" r="3.3"/><circle cx="68.5" cy="98.5" r="3.3"/>
    <circle cx="53" cy="75" r="12.5"/>
    <rect x="45" y="78" width="16" height="12.5" rx="3.5"/>
  </g>
  <g fill="#1e1a26">
    <ellipse cx="48" cy="76" rx="3.8" ry="4.2"/>
    <ellipse cx="58" cy="76" rx="3.8" ry="4.2"/>
    <path d="M53 80l-2.2 4.2h4.4z"/>
    <rect x="48.8" y="86.5" width="1.6" height="4"/>
    <rect x="52.2" y="86.5" width="1.6" height="4"/>
    <rect x="55.6" y="86.5" width="1.6" height="4"/>
  </g>

  <!-- The magnifier sits over the empty end of the label. -->
  <path d="M100 100l11 11" stroke="#3d3846" stroke-width="10" stroke-linecap="round"/>
  <path d="M100 100l11 11" stroke="url(#handle)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="90" cy="90" r="15.5" fill="#000000" fill-opacity="0.2"/>
  <circle cx="89" cy="88.5" r="14" fill="url(#glass)" stroke="url(#brass)" stroke-width="5"/>
  <path d="M80.5 84.5a9 9 0 0 1 6.5-5.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.9"/>
</svg>
