<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>PirateFinder</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="shutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0bfbc"/>
      <stop offset="0.45" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#99c1f1" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e45c"/>
      <stop offset="1" stop-color="#c88800"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#986a44"/>
      <stop offset="1" stop-color="#63452c"/>
    </linearGradient>
  </defs>

  <!-- Disk edge, then the face, with the chamfered top right corner. -->
  <path d="M18 12h78l14 14v84a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6V18a6 6 0 0 1 6-6z" fill="#1a5fb4"/>
  <path d="M18 8h78l14 14v84a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6z" fill="url(#body)"/>

  <!-- Metal shutter with the window onto the magnetic disk. -->
  <rect x="34" y="8" width="54" height="36" fill="url(#shutter)"/>
  <rect x="34" y="42" width="54" height="2" fill="#9a9996"/>
  <rect x="34" y="8" width="1.5" height="36" fill="#9a9996"/>
  <rect x="86.5" y="8" width="1.5" height="36" fill="#9a9996"/>
  <rect x="68" y="14" width="12" height="24" rx="1.5" fill="#3d3846"/>
  <rect x="69.5" y="15.5" width="9" height="21" rx="1" fill="#63452c"/>

  <!-- Write-protect hole. -->
  <rect x="15" y="99" width="6" height="7" rx="1" fill="#0d3b75"/>

  <!-- The label: a Jolly Roger. -->
  <rect x="22" y="52" width="72" height="56" rx="3" fill="url(#label)"/>
  <g stroke="#f6f5f4" stroke-width="6" stroke-linecap="round">
    <path d="M37 64L79 100M79 64L37 100"/>
  </g>
  <g fill="#f6f5f4">
    <circle cx="33.5" cy="63" r="3.6"/><circle cx="36.5" cy="59.8" r="3.6"/>
    <circle cx="82.5" cy="63" r="3.6"/><circle cx="79.5" cy="59.8" r="3.6"/>
    <circle cx="33.5" cy="101" r="3.6"/><circle cx="36.5" cy="104.2" r="3.6"/>
    <circle cx="82.5" cy="101" r="3.6"/><circle cx="79.5" cy="104.2" r="3.6"/>
    <circle cx="58" cy="76" r="15"/>
    <rect x="48.5" y="80" width="19" height="15" rx="4"/>
  </g>
  <g fill="#241f31">
    <ellipse cx="52" cy="77" rx="4.4" ry="4.8"/>
    <ellipse cx="64" cy="77" rx="4.4" ry="4.8"/>
    <path d="M58 81.5l-2.6 5h5.2z"/>
    <rect x="53.2" y="89" width="1.8" height="6"/>
    <rect x="57.1" y="89" width="1.8" height="6"/>
    <rect x="61" y="89" width="1.8" height="6"/>
  </g>

  <!-- Magnifying glass over the corner of the disk. -->
  <path d="M109 109l12 12" stroke="#3d3846" stroke-width="11" stroke-linecap="round"/>
  <path d="M109 109l12 12" stroke="url(#handle)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="97" cy="97" r="18" fill="#000000" fill-opacity="0.18"/>
  <circle cx="96" cy="95" r="17" fill="url(#glass)" stroke="url(#brass)" stroke-width="6"/>
  <path d="M86 90a11 11 0 0 1 8-7" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
</svg>
