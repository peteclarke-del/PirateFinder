name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests and source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The interface tests need PyGObject, GTK 4 and libadwaita, which come
      # from the distribution rather than pip, so this job uses Ubuntu's own
      # Python 3.12 and the same libadwaita 1.5 the package targets.
      - name: Install GTK, the display server and metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            xvfb dbus-daemon appstream desktop-file-utils

      - name: Check Python style
        run: |
          pipx run ruff==0.16.4 check src catalogue_builder tests
          pipx run ruff==0.16.4 format --check src catalogue_builder tests

      - name: Run tests
        env:
          PYTHONPATH: src:.
          # Fail rather than skip the window tests if GTK cannot be imported.
          PIRATEFINDER_REQUIRE_GTK: "1"
          GSK_RENDERER: cairo
        run: dbus-run-session -- xvfb-run --auto-servernum /usr/bin/python3 -m unittest discover -s tests -v

      - name: Compile Python sources
        run: /usr/bin/python3 -m compileall -q src catalogue_builder tests

      - name: Check launcher syntax
        run: |
          bash -n piratefinder packaging/*.sh
          sh -n packaging/piratefinder packaging/gw packaging/postinst packaging/postrm

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/com.github.pclarke.PirateFinder.desktop
          appstreamcli validate --no-net data/com.github.pclarke.PirateFinder.metainfo.xml

  package:
    name: Package for ${{ matrix.distro }} ${{ matrix.arch }} without a catalogue
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two of the release targets, both on native runners so they stay
        # quick. The Release workflow builds every target.
        include:
          - distro: ubuntu-24.04
            arch: amd64
            runner: ubuntu-24.04
          - distro: debian-13
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DISTRO: ${{ matrix.distro }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the package
        run: >-
          ./packaging/build-deb.sh --container --distro "${DISTRO}" --arch "${ARCH}"
          --no-catalogue dist

      - name: Show the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Install and test the package
        run: ./packaging/install-test.sh dist/*.deb
