# Atari Legend menu sets that data/series/match-internet-archive.toml names.
#
# The Atari Legend importer registers a series for every menu set that no
# declared series names, with the id made from the set name, the set name as
# its name and the set's crews as its group. These sets are declared here in
# exactly that form, so that the Internet Archive rules may name them; the
# Atari Legend and TOSEC importers find each by its name as before, and the
# catalogue is the same with or without this file.

[[series]]
id = "the-world-s-picture-collection"
name = "The World's Picture Collection"
platform = "atari-st"
kind = "menu"
group = "The World's Picture Collection"

