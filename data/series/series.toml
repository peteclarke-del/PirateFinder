# Numbered series known to PirateFinder.
#
# Each [[series]] table declares one series. The fields are:
#
#   id           stable identifier used by every importer and in the catalogue
#   name         display name, also searchable
#   platform     "atari-st" or "amiga"
#   kind         "menu" (crew menu disks and game compacts), "pack" (demo,
#                music, utility, doc and trainer packs) or "compilation"
#   group        the crew or publisher behind the series
#   label        label format; {name}, {number}, {number3}, {part},
#                {part_suffix}, {version} and {version_suffix} are replaced
#   aliases      what people type for the series; the query parser
#                recognises them in front of a disk number ("pp 51", "a250")
#
# Series that are not declared here are still found: the TOSEC importer
# registers numbered compilations it recognises by their name pattern. The
# rules that recognise a series in each source live in match-<source>.toml.

# ----------------------------------------------------------------------------
# Atari ST menu disks and compacts
# ----------------------------------------------------------------------------

