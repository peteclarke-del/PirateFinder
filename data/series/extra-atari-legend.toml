# Series found in Atari Legend that series.toml does not declare.
#
# Each one is a menu set on Atari Legend that TOSEC also lists as numbered
# disks, with the same numbering (checked against the TOSEC DATs before it was
# added). The name is the Atari Legend set name, so the Atari Legend importer
# finds the series by name, and the aliases include the TOSEC name without
# the number. Sets that TOSEC does not list are left to the importer, which
# registers them from their set name.
#
# data/series/match-tosec.toml tells the TOSEC importer how TOSEC names these
# disks, so both sources file them under the same series.

[[series]]
id = "serenade"
name = "Serenade"
platform = "atari-st"
kind = "pack"
group = "Serenade"
aliases = ["serenade pd disk", "serenade pd"]

