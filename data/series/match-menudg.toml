# How the 8bitchip importer recognises the crew prefixes of its disk ids.
#
# Patterns are matched, case-insensitively, against the disk id of each row,
# for example "AU061", "DB031B" (part B), "PP013V2" (version 2) or
# "AU123EV2" (part E, version 2). The prefixes are the ones the list's own
# legend declares. EM (Electric Mouse) and SO (Spaced Out) have no numbered
# series and are left out.

[[match]]
series = "automation"
source = "8bitchip"
patterns = ['^AU(?P<number>\d+)(?P<part>[A-Z])?(?:V(?P<version>\d+))?$']

