# How the Atari Legend importer recognises declared series.
#
# Atari Legend names menu sets, not disks. Each pattern is matched,
# case-insensitively, against the label the site gives a menu: the set name
# followed by "#" and the menu number, then " v" and the version when there
# is one, for example "The Medway Boys #20" or "Pompey Pirates #1 v2". A menu
# with no number is labelled with its issue ("Mad Vision B") or with
# "#[no number]".
#
# Most rules only name the set. A rule may also look at the number, which is
# how one set that holds two series is split. A named group "number", when a
# pattern has one, replaces the menu number. Menus that no rule recognises go
# to the series whose name or alias equals the set name, and sets that name
# no series become series of their own.
#
# Numbering was checked against the TOSEC names of each series before a rule
# was added. "Arakis / Zuul" has no rule on purpose: it is its own numbered
# series, and its numbers would collide with Zuul's. "Automation (fake
# menus)" has none either, so the fakes never merge with real Automation
# disks.

[[match]]
series = "pompey-pirates"
source = "atari-legend"
patterns = ['^Pompey Pirates #']

[[match]]
series = "pompey-pirates-krappy-kompact"
source = "atari-legend"
patterns = ['^Pompey Pirates Krappy Kompact #']

[[match]]
series = "medway-boys"
source = "atari-legend"
patterns = ['^The Medway Boys #']

# One Atari Legend set holds both crews' menus, numbered as TOSEC numbers
# them: Flame of Finland 1 to 54, then Superior from 55.
[[match]]
series = "flame-of-finland"
source = "atari-legend"
patterns = ['^Flame Of Finland/Superior #(?:[1-9]|[1-4][0-9]|5[0-4])\b']

[[match]]
series = "superior"
source = "atari-legend"
patterns = ['^Flame Of Finland/Superior #(?:5[5-9]|[6-9][0-9]|[1-9][0-9]{2,})\b']

