# How the Internet Archive importer recognises menu disks by their file names.
#
# The "[Menus].7z" archive of the atari-st-collection item keeps many menu
# disks as zips with short names, one folder per crew, for example
# "[Menus]/P/Pompey Pirates/PP_054.zip". These names are not TOSEC names, so
# the zips cannot be placed by name; a rule here gives the series, number,
# part and version instead. The patterns are matched, without case, against
# the member path without ".zip". A recognised zip only joins a disc another
# source describes; it never makes a disc of its own.
#
# Suffixes follow the crews' own habits: a letter after the number is the
# part ("ZUUL032A", "med_013a"), "V2" is the second version and "vbis" the
# second edition ("ZUUL004vbis"); "V1" is the first edition, which the
# catalogue leaves unversioned.
#
# Only crews whose series is declared in data/series are listed; the
# other folders name series that the TOSEC importer finds by itself, and
# their zips stay unplaced.

[[match]]
series = "zuul"
source = "internet-archive"
patterns = ['^\[Menus\]/Z/Zuul/ZUUL0*(?P<number>\d+)(?P<part>[A-Z])?(?:v(?P<version>bis))?$']

[[match]]
series = "flame-of-finland"
source = "internet-archive"
patterns = ['^\[Menus\]/F/Flame of Finland & Superior/FOF0*(?P<number>\d+)(?P<part>[A-Z])?$']

[[match]]
series = "superior"
source = "internet-archive"
patterns = ['^\[Menus\]/F/Flame of Finland & Superior/SUPE0*(?P<number>\d+)(?P<part>[A-Z])?$']

[[match]]
series = "fuzion"
source = "internet-archive"
patterns = ['^\[Menus\]/F/Fuzion/FUZ0*(?P<number>\d+)(?:V(?P<version>\d+))?$']

[[match]]
series = "pompey-pirates"
source = "internet-archive"
# "PP_013_2" is the second disk of menu 13.
patterns = ['^\[Menus\]/P/Pompey Pirates/PP_0*(?P<number>\d+)_?(?P<part>[A-Z0-9])?(?:V(?P<version>\d+))?$']

