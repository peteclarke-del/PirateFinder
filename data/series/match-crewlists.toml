# How the crew lists importer recognises series on the Pompey Pirates CD-R.
#
# List entries are matched as "<list path> <heading>: <code>", for example
# "MENUS/POMPEY/POMPEY.TXT POMPEY PIRATES COMPACT DISKS: CD13-4A"; entries of
# the merged index as "MENUS/COMPLETE.TXT <crew> #<code>"; the Sewer doc list
# as "DOCS/SEWER/LIST.DOC <disk>"; disk images by their path in the ISO, for
# example "MENUS/POMPEY/PP_13_4A.MSA". Each pattern captures the number, the
# raw part of the code ("4A", "2", "B") and a version ("V2"). The importer
# turns the raw parts of one number into part letters in list order.

[[match]]
series = "pompey-pirates"
source = "crew-lists"
patterns = [
    '^MENUS/POMPEY/POMPEY\.TXT POMPEY PIRATES COMPACT DISKS: CD(?P<number>\d+)(?:V(?P<version>\d+))?-?(?P<part>[0-9A-Z]*)$',
    '^MENUS/COMPLETE\.TXT Pompey Pirates Menu #(?P<number>\d+)(?:V(?P<version>\d+))?-?(?P<part>[0-9A-Z]*)$',
    '^MENUS/POMPEY/PP_(?P<number>\d+)(?:V(?P<version>\d+))?_?(?P<part>[0-9A-Z]*)\.MSA$',
]

[[match]]
series = "pompey-pirates-krappy-kompact"
source = "crew-lists"
patterns = [
    '^MENUS/POMPEY/POMPEY\.TXT POMPEY PIRATES CRAPPY COMPACTS: CD(?P<number>\d+)(?P<part>[A-Z]?)$',
    '^MENUS/COMPLETE\.TXT Pompey Pirates Crappy #(?P<number>\d+)(?P<part>[A-Z]?)$',
    '^MENUS/POMPEY/PPKC_(?P<number>\d+)(?P<part>[A-Z]?)\.MSA$',
]

[[match]]
series = "medway-boys"
source = "crew-lists"
patterns = [
    '^MENUS/MEDWAY/MEDWAY\.TXT [^:]*: CD(?P<number>\d+)(?P<part>[A-Z]?)$',
    '^MENUS/COMPLETE\.TXT Medway Boys Menu #(?P<number>\d+)(?P<part>[A-Z]?)$',
    '^MENUS/MEDWAY/MED_(?P<number>\d+)(?P<part>[A-Z]?)\.MSA$',
]

[[match]]
series = "flame-of-finland"
source = "crew-lists"
