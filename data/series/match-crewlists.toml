[[match]]
series = "sewer-doc"
source = "crew-lists"
patterns = [
    '^DOCS/SEWER/LIST\.DOC (?P<number>\d+)$',
    '^DOCS/SEWER/SEW(?:DOC|DC)(?P<number>\d+)(?P<part>[A-Z]?)\.MSA$',
]

[[match]]
series = "terdd-doc"
source = "crew-lists"
patterns = [
    '^DOCS/SEWER/LIST\.DOC T(?P<number>\d+)$',
    '^DOCS/SEWER/TERDD_(?P<number>\d+)\.MSA$',
]
