    '^MENUS/FOF_MENU/FOF\.TXT [^:]*: CD(?P<number>\d+)(?P<part>[A-Z]?)$',
    '^MENUS/COMPLETE\.TXT F\.O\.F\. Menu #(?P<number>\d+)(?P<part>[A-Z]?)$',
    '^MENUS/FOF_MENU/FOF_(?P<number>\d+)(?P<part>[A-Z]?)\.MSA$',
]

