# How the TOSEC importer recognises declared series in TOSEC DAT names.
#
# Each pattern is matched, case-insensitively, against the full TOSEC game
# name, for example "Compact #004 (1990)(Skid Row)[a]", so a pattern can use
# the publisher field to tell apart two series with the same title. The
# named group "number" is required; "part" and "version" are optional. When
# a pattern does not capture them, the part comes from the name's
# "(Part A)" or "(Disk 1 of 2)" field and the version from its "v2.0" suffix.
#
# The shared tail "(?: (?P<version>v\d+(?:\.\d+)*))? \(" accepts an optional
# version and then requires the date field, so combined entries such as
# "Pompey Pirates Menu Disk 51, 23, 86" are left to the generic rules.

# ----------------------------------------------------------------------------
# Atari ST
# ----------------------------------------------------------------------------

[[match]]
series = "automation"
source = "tosec"
patterns = ['^Automation Menu Disk (?P<number>\d+)(?: (?P<version>v\d+(?:\.\d+)*))? \(']

