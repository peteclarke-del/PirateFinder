# Cracking and demo groups, with the abbreviations sources use for them.
#
# TOSEC and other sources often give a group as a short tag, for example
# "[cr QTX]" or "[t +2 SR]". The catalogue builder expands a tag found in
# "abbreviations" or "aliases" to "name", and the search index keeps both
# spellings, so "Quartex" and "QTX" find the same disks.
#
#   name            the spelling shown to the user
#   abbreviations   short tags, matched case-sensitively
#   aliases         other spellings, matched after normalisation
#
# Only expansions that are well established belong here. A tag that is not
# listed is shown as the source gives it.

[[group]]
name = "Skid Row"
abbreviations = ["SR"]
aliases = ["Skidrow"]

